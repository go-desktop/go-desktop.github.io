<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Site.Title }} — a map of the pure-Go ecosystem</title>
<meta name="description" content="One map of a pure-Go ecosystem: a widget toolkit and the desktop around it, typesetting and fonts, storage and filesystems, firmware and boot, a Ruby virtual machine with one organisation per gem, SIMD kernels, microVMs and configuration management. CGO_ENABLED=0 throughout, six 64-bit targets, 100% statement coverage as a CI gate, BSD-3-Clause.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
{{/* The shared design: palette, nav, hero, cards, buttons, the theme toggle's
     script and the darkreader-lock meta all come from the kit. Everything this
     page used to carry in a <style> block of its own is in here now. */}}
{{ partial "styles.html" . }}
{{ partial "map-extras.html" . }}
</head>
<body class="lm">

  {{ $orgCount := 0 }}{{ $repoCount := 0 }}
  {{ range .Site.Params.families }}{{ range .orgs }}{{ $orgCount = add $orgCount 1 }}{{ $repoCount = add $repoCount (int .repos) }}{{ end }}{{ end }}
  {{ $gems := hugo.Data.ecosystem.gems }}
  {{ $totalOrgs := add $orgCount (len $gems) }}
  {{ $totalRepos := add $repoCount (int hugo.Data.ecosystem.gem_repos) }}

  <header class="nav"><div class="wrap">
    <a class="brand" href="/"><img class="glyph" src="/img/logo.svg" width="32" height="32" alt="go-desktop logo"> go-desktop</a>
    <nav><a href="#map">The map</a><a href="#gems">Ruby gems</a><a href="#standards">Standards</a><a href="https://go-desktop.github.io/docs/">Docs</a></nav>
    {{ partial "theme-toggle.html" . }}
  </div></header>
  {{/* The ribbon points at the generator, not at the organisation: this page
       is written by go-desktop/catalog, and that is the repository a reader
       who wants to change something has to open. */}}
  {{ partial "fork-ribbon.html" "https://github.com/go-desktop/catalog" }}

  <div class="phero"><div class="wrap">
    <h1>A map of one <span class="accent">pure-Go ecosystem</span>.</h1>
    <p class="sub">{{ $totalOrgs }} organisations and {{ $totalRepos }} repositories of libraries that
      build a desktop, typeset a document, mount a filesystem, boot a machine and run Ruby, with
      <b>no C anywhere</b>.</p>
    <div class="cta" style="margin-top:26px">
      <a class="btn btn-primary" href="https://go-desktop.github.io/docs/">{{ partial "icons/book.html" . }}Read the documentation →</a>
      <a class="btn btn-ghost" href="#map">{{ partial "icons/arrow-right.html" . }}Browse the map</a>
      <a class="btn btn-ghost" href="https://github.com/go-desktop">{{ partial "icons/github.html" . }}GitHub</a>
    </div>
    <div class="trust">
      <span><b>{{ $totalOrgs }}</b> organisations</span>
      <span><b>CGO_ENABLED=0</b> throughout</span>
      <span><b>6</b> 64-bit targets</span>
      <span><b>100%</b> statement coverage as a CI gate</span>
      <span><b>BSD-3-Clause</b></span>
    </div>
  </div></div>

  <section class="psec" id="map"><div class="wrap">
    <p class="cap">Every library here is written in Go and compiled with <code>CGO_ENABLED=0</code>.
      That is not a stylistic preference: it is what makes one binary cross-compile to six
      architectures, run inside a browser as WebAssembly, and boot on bare metal without a libc.
      Where a good pure-Go library already exists it is used rather than rewritten; where the only
      option was a C library behind cgo, the capability was rebuilt.</p>

    <p class="cap">The ecosystem is deliberately split into <b>one organisation per domain and one
      repository per capability</b>, so a program that needs an ext4 reader takes an ext4 reader and
      not a storage framework. What follows is the whole of it, grouped by what the code does.
      Counts are the public repositories that hold code — brand, docs and landing repositories are
      not counted.</p>

    <nav class="toc">
      {{ range .Site.Params.families }}<a href="#{{ .key }}">{{ .title }}</a>{{ end }}
      <a href="#gems">Ruby gems</a>
    </nav>
  </div></section>

  {{ range .Site.Params.families }}
  <section class="psec" id="{{ .key }}" style="scroll-margin-top:72px"><div class="wrap">
    <h2>{{ .title }} <span class="n">· {{ len .orgs }} organisation{{ if ne (len .orgs) 1 }}s{{ end }}</span></h2>
    <p class="cap">{{ .blurb }}</p>
    <div class="grid">
      {{ range .orgs }}
      <article class="card">
        <h3>
          <a href="https://github.com/{{ .name }}"><code>{{ .name }}</code></a>
          <span class="count">{{ .repos }} repo{{ if ne (int .repos) 1 }}s{{ end }}</span>
        </h3>
        <p>{{ .role }}</p>
        <div class="links">
          {{ if .site }}<a href="https://{{ .name }}.github.io/">Site</a>{{ end }}
          {{ if .docs }}<a href="https://{{ .name }}.github.io/docs/">Docs</a>{{ end }}
          <a href="https://github.com/{{ .name }}">Repositories</a>
        </div>
      </article>
      {{ end }}
    </div>
  </div></section>
  {{ end }}

  <section class="psec" id="gems" style="scroll-margin-top:72px"><div class="wrap">
    <h2>Ruby gems, one organisation each <span class="n">· {{ len $gems }} organisations</span></h2>
    <p class="cap">The Ruby virtual machine is only useful with a library around it. Each gem it
      needs is reimplemented in pure Go in its own <code>go-ruby-*</code> organisation — the standard
      library, Rails and its dependencies, the testing stack, the Puppet stack, database drivers,
      serialisation formats and template engines. Every one of them is byte-compared against MRI
      where a byte comparison is meaningful.</p>
    <div class="chips">
      {{ range $gems }}<a href="https://github.com/go-ruby-{{ . }}" title="go-ruby-{{ . }}">{{ . }}</a>{{ end }}
    </div>
  </div></section>

  <section class="psec" id="standards" style="scroll-margin-top:72px"><div class="wrap">
    <h2>What every repository is held to</h2>
    <p class="cap">The same conformance standard applies across all {{ $totalOrgs }} organisations,
      which is why they can be read as one ecosystem rather than a pile of unrelated modules.</p>
    <div class="grid">
      <article class="card">
        <h3><code>CGO_ENABLED=0</code></h3>
        <p>No cgo, and no shelling out to a command-line tool in place of a library. A dependency is
          a Go module or it is written. That is what keeps cross-compilation, <code>js/wasm</code>
          and bare-metal targets available at once.</p>
      </article>
      <article class="card">
        <h3>Six 64-bit targets</h3>
        <p>Build and test on amd64, arm64, riscv64, loong64, ppc64le and s390x — native where
          runners exist, under qemu-user otherwise. s390x is big-endian, which keeps every
          on-disk and on-wire encoding honest.</p>
      </article>
      <article class="card">
        <h3>100% statement coverage</h3>
        <p>A CI gate, error branches included. A skipped test is not a passing one: jobs fail when
          a toolchain is missing rather than turning green quietly.</p>
      </article>
      <article class="card">
        <h3>Measured, not asserted</h3>
        <p>Performance claims come with a benchmark against the reference implementation, and
          correctness claims about a format come with a byte comparison against it. Decoders are
          fuzzed.</p>
      </article>
      <article class="card">
        {{/* ⛔ This card said "versioned MkDocs Material documentation". The
             docs sites moved to Hugo and our Hextra fork, and the landings to
             the shared landingkit module — so the one card on this page that
             describes how the pages themselves are built was describing a
             toolchain the ecosystem had stopped using. */}}
        <h3>One landing, one docs site</h3>
        <p>Each organisation publishes a Hugo landing at <code>&lt;org&gt;.github.io</code> built on
          the shared <a href="https://github.com/go-fleettools/landingkit">landing kit</a>, and
          versioned documentation at <code>&lt;org&gt;.github.io/docs/</code> built with our Hextra
          fork — the same brand, derived from each logo, and a light/dark/system toggle.</p>
      </article>
      <article class="card">
        <h3>BSD-3-Clause</h3>
        <p>Every repository, every organisation. Copyright is held by the authors of the
          organisation it lives in.</p>
      </article>
    </div>
  </div></section>

  <section class="psec" id="reserved" style="scroll-margin-top:72px"><div class="wrap">
    <h2>Held, not yet built</h2>
    <p class="cap">These organisation names are reserved and empty. They are listed so the map has
      no silent gaps — an empty organisation is not a shipped one.
      {{ range $i, $r := hugo.Data.ecosystem.reserved }}{{ if $i }}, {{ end }}<a href="https://github.com/{{ $r }}"><code>{{ $r }}</code></a>{{ end }}.</p>
  </div></section>

  <section class="psec"><div class="wrap">
    <div class="band">
      <h2>No number on this page is typed by hand.</h2>
      <p>Every count, every organisation and every description comes from <code>go-desktop/catalog</code>,
        which reads the live GitHub organisation list and reconciles it against a curated
        classification. An organisation that holds code and belongs to no family fails the build, so
        the map cannot quietly omit something that exists.</p>
      <a class="btn btn-ghost" href="https://github.com/go-desktop/catalog">{{ partial "icons/github.html" . }}Read the generator →</a>
    </div>
  </div></section>

  <footer><div class="wrap">
    <span>© the go-desktop authors · BSD-3-Clause</span>
    <span><a href="https://go-desktop.github.io/docs/">Documentation</a> · <a href="https://github.com/go-desktop/brand">Brand assets</a></span>
  </div></footer>
</body>
</html>
