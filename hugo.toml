  [[params.families.orgs]]
    name = "go-freedesktop"
    repos = 10
    site = true
    docs = true
    role = "freedesktop.org integration — .desktop entries, icon themes, shared MIME info, application associations, the menu tree, desktop notifications and Secret Service — over an owned X11 protocol core that also serves screen capture and the toolkit's window back-end."
