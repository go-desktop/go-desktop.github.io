    name = "go-gtk"
    repos = 1
    site = false
    docs = false
    role = "GTK4 driven from pure Go over purego, CGO=0 — the Linux native-toolkit bridge for go-widgets, sibling of go-macos/objc."
  [[params.families.orgs]]
    name = "go-widgets"
    repos = 19
    site = true
    docs = true
