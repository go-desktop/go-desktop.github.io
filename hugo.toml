    repos = 6
    site = true
    docs = true
    role = "Icon and logo packs as embedded pure-Go SVG data — Simple Icons brand marks, Devicon, Material and Seti file types, vscode-icons, and Iconoir. One repository per pack, so a program embeds the set it draws and not the other five; the drawing itself is go-gfx's `svg` package."
  [[params.families.orgs]]
    name = "go-thumbnail"
    repos = 1
    site = true
    docs = true
    role = "The freedesktop Thumbnail Managing Standard cache."
  [[params.families.orgs]]
    name = "go-keyring"
    repos = 1
    site = true
    docs = true
    role = "One secret store over macOS Keychain, Windows Credential Manager and Linux Secret Service — no cgo, no CLI exec."
  [[params.families.orgs]]
    name = "go-macos"
    repos = 26
    site = true
    docs = true
    role = "The macOS foundation, all of it CGO-free through purego: the shared Objective-C runtime bridge, real AppKit controls embedded in a Go-painted window, Keychain and Touch ID, notifications and menu-bar items, accessibility, global hotkeys, login items and launch agents, IOKit HID, DiskArbitration, hardware audio and video decode, ScreenCaptureKit capture, and virtual displays the desktop extends onto."
  [[params.families.orgs]]
